<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skull Realms | Live Synth</title>

    <!-- PixiJS -->
    <script src="https://pixijs.download/release/pixi.js"></script>

    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Howler.js (الصوتيات) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

    <style>
        body {
            margin: 0;
            background: #0a0a0c;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        #chat-box {
            position: absolute;
            bottom: 20px; left: 20px;
            width: 300px; height: 220px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00f3ff;
            pointer-events: auto;
            color: #00f3ff;
            overflow-y: auto;
            padding: 10px;
            border-radius: 5px;
            backdrop-filter: blur(10px);
        }

        .neon-text {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }
    </style>
</head>

<body>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="chat-box">
            <div class="neon-text">SYSTEM: Connected to Skull Realms...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
