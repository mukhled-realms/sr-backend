<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Realms | Live Synth</title>

    <!-- PixiJS -->
    <script src="https://pixijs.download/release/pixi.js"></script>

    <!-- Socket.io -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Howler.js (الصوتيات) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>

    <!-- موسيقى الخلفية -->
    <audio id="bgMusic" src="/assets/music/lofi.mp3" loop></audio>

    <!-- موسيقى الأحداث الحماسية -->
    <audio id="eventMusic" src="/assets/music/hype.mp3" loop></audio>

    <style>
        body {
            margin: 0;
            background: #0a0a0c;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }

        #ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        #chat-box {
            position: absolute;
            bottom: 20px; left: 20px;
            width: 300px; height: 220px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid #00f3ff;
            pointer-events: auto;
            color: #00f3ff;
            overflow-y: auto;
            padding: 10px;
            border-radius: 5px;
            backdrop-filter: blur(10px);
        }

        .neon-text {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }
        
        /* شاشة الدخول التي طلبها OpenAI */
        #overlay {
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #0a0a0c; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
        }
        
        #start-btn {
            padding: 20px 40px; 
            background: #00f3ff; 
            color: #0a0a0c; 
            font-family: 'Courier New', sans-serif; 
            font-weight: bold;
            border: none; 
            font-size: 24px;
            box-shadow: 0 0 20px #00f3ff; 
            cursor: pointer;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <!-- شاشة دخول اللعبة -->
    <div id="overlay">
        <button id="start-btn">ENTER SKULL REALMS</button>
    </div>

    <div id="game-container"></div>

    <div id="ui-layer">
        <div id="chat-box">
            <div class="neon-text">SYSTEM: Connected to Skull Realms...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
