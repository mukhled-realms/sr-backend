<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skull Realms | Live Synth</title>
    <script src="https://pixijs.download/release/pixi.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { margin: 0; background: #0a0a0c; overflow: hidden; font-family: 'Courier New', monospace; }
        #game-container { width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        #chat-box { 
            position: absolute; bottom: 20px; left: 20px; width: 300px; height: 200px; 
            background: rgba(0, 0, 0, 0.7); border: 1px solid #00f3ff; pointer-events: auto;
            color: #00f3ff; overflow-y: auto; padding: 10px; border-radius: 8px; backdrop-filter: blur(8px); font-size: 14px;
        }
        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-thumb { background: #00f3ff; border-radius: 5px; }
        .neon-text { color: #ff0055; text-shadow: 0 0 10px #ff0055; }
        
        .support-btn {
            position: absolute; bottom: 20px; right: 20px; pointer-events: auto;
            background: #1a1a1a; border: 2px solid #ff0055; color: white; font-weight: bold;
            padding: 12px 24px; border-radius: 12px; cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3); transition: all 0.3s ease;
            text-decoration: none; display: flex; align-items: center; gap: 10px;
        }
        .support-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 0, 85, 0.6); border-color: #ff3366; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="ui-layer">
        <div id="chat-box">
            <div class="neon-text">SYSTEM: Connected to Skull Realms...</div>
        </div>
        <a href="https://www.paypal.com/ncp/payment?hosted_button_id=53JHES9WRLTML" target="_blank" class="support-btn">
            <span style="font-size: 22px;">💀</span>
            <div style="display: flex; flex-direction: column; text-align: left;">
                <span style="font-size: 10px; color: #ff0055; letter-spacing: 1px;">دعم المطور</span>
                <span style="font-size: 14px;">باقة الدعم (2000 ر.س)</span>
            </div>
        </a>
    </div>
    <script src="app.js"></script>
</body>
</html>
