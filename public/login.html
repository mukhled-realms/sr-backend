<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Skull Realms</title>
    <style>
        body {
            margin: 0;
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #0a0a16, #1a1a2e);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            width: 320px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #9b59ff; margin-bottom: 5px; font-size: 28px; }
        p.sub { color: #ccc; margin-bottom: 20px; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
        input:focus { outline: none; border-color: #9b59ff; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 8px;
            background: #9b59ff;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover { background: #b07aff; }
        .link { color: #9b59ff; text-decoration: none; font-size: 14px; margin-top: 15px; display: block; }
        .error { color: #ff6b6b; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>🔐 تسجيل الدخول</h1>
        <p class="sub">ادخل بياناتك للدخول إلى عالم Skull Realms</p>
        
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
            <a href="/register.html" class="link">ليس لديك حساب؟ سجل الآن</a>
        </form>
        
        <div class="error" style="display: none;">بيانات الدخول غير صحيحة</div>
    </div>
</body>
</html>جدد
