<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Skull Realms — المنصة الحية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://www.paypal.com/sdk/js?client-id=sb&currency=USD"></script>
  <style>
    :root{--bg-0:#0a0a0d;--bg-1:#111116;--bone:#efe8da;--panel-line:#2a2a33;--violet:#9b6bff}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:'Cairo',sans-serif;background:linear-gradient(180deg,#0b0b0d,#070708);color:var(--bone);display:flex;justify-content:center;align-items:center}
    .stage{width:100%;max-width:460px;height:100vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0f0f12,#0b0b0d);border:1px solid var(--panel-line);overflow:hidden}
    .hud{display:flex;justify-content:space-between;padding:12px}
    .arena{flex:1;display:flex;align-items:center;justify-content:center;position:relative}
    #skullBtn{width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,#24242c,#0d0d11);display:grid;place-items:center;font-size:96px;cursor:pointer;border:none}
    .rail{display:flex;gap:8px;padding:12px;justify-content:center}
    .rail-btn{background:rgba(255,255,255,0.02);padding:10px 14px;border-radius:12px;cursor:pointer;border:1px solid var(--panel-line)}
    .sheet{position:fixed;inset:auto 0 0 0;background:#0b0b0d;border-top-left-radius:12px;border-top-right-radius:12px;padding:12px;display:none}
    .sheet.open{display:block}
    .store-grid{display:flex;flex-direction:column;gap:10px}
    .store-item{display:flex;justify-content:space-between;align-items:center;padding:8px;background:rgba(255,255,255,0.02);border-radius:8px}
    .chat-feed{position:absolute;right:12px;top:80px;width:220px;max-height:60vh;overflow:auto;background:rgba(0,0,0,0.25);padding:8px;border-radius:8px;border:1px solid var(--panel-line)}
    .chat-msg{padding:6px 8px;border-radius:8px;background:rgba(255,255,255,0.02);margin-bottom:6px;font-size:13px}
  </style>
</head>
<body>
  <div class="stage">
    <div class="hud">
      <div style="display:flex;align-items:center;gap:8px"><div style="font-size:22px">💀</div><div style="font-weight:700">SKULL REALMS</div></div>
      <div style="display:flex;gap:8px;align-items:center">LIVE • 💎 <span id="diamondCount">120</span></div>
    </div>

    <div class="arena">
      <button id="skullBtn" aria-label="اضغط على الجمجمة">💀</button>
      <div class="chat-feed" id="chatFeed"></div>
    </div>

    <div class="rail">
      <div class="rail-btn" id="openStore">🛒 المتجر</div>
      <div class="rail-btn" id="openAuction">🏦 المزاد</div>
      <div class="rail-btn" id="openSupport">💬 الدعم</div>
    </div>
  </div>

  <!-- Store sheet -->
  <div class="sheet" id="storeSheet">
    <h3>شراء الجواهر</h3>
    <div class="store-grid" id="storeGrid"></div>
    <div id="paypal-button-container" style="margin-top:10px"></div>
    <div style="margin-top:10px;text-align:left"><button onclick="closeSheet()">إغلاق</button></div>
  </div>

  <script>
    (function(){
      const API_URL = location.origin;
      const socket = io(API_URL);

      const skullBtn = document.getElementById('skullBtn');
      const chatFeed = document.getElementById('chatFeed');
      const storeSheet = document.getElementById('storeSheet');
      const storeGrid = document.getElementById('storeGrid');

      let score = 0;

      socket.on('connect', () => socket.emit('join', { room: 'global' }));
      socket.on('chat:message', (msg) => addChat(msg));

      function addChat(msg){
        const el = document.createElement('div');
        el.className = 'chat-msg';
        el.textContent = msg;
        chatFeed.prepend(el);
      }

      skullBtn.addEventListener('click', () => {
        score += 1;
        socket.emit('chat:message', `نقرة — نقاط: ${score}`);
      });

      document.getElementById('openStore').addEventListener('click', async () => {
        try {
          const res = await fetch(`${API_URL}/api/store/items`);
          const data = await res.json();
          renderStore(data.items || []);
          openSheet();
        } catch (err) {
          alert('فشل تحميل المتجر');
          console.error(err);
        }
      });

      function renderStore(items){
        storeGrid.innerHTML = '';
        items.forEach(item => {
          const div = document.createElement('div');
          div.className = 'store-item';
          div.innerHTML = `
            <div>
              <div style="font-weight:700">${item.name}</div>
              <div style="color:#aaa">${item.cost} USD</div>
            </div>
            <div><button onclick="buyItem('${item.id}')">شراء</button></div>
          `;
          storeGrid.appendChild(div);
        });
      }

      window.buyItem = async (itemId) => {
        try {
          const res = await fetch(`${API_URL}/api/store/buy`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ itemId, userId: 'user_123' })
          });
          const data = await res.json();
          if (!res.ok || !data.ok) throw new Error(data.message || 'خطأ');
          alert('تم بدء عملية الشراء. تابع الدفع إن وُجد.');
          console.log('buy response', data);
        } catch (err) {
          console.error(err);
          alert('فشل الشراء: ' + (err.message || 'خطأ'));
        }
      };

      window.openSheet = openSheet;
      window.closeSheet = closeSheet;
      function openSheet(){ storeSheet.classList.add('open'); storeSheet.style.display = 'block'; }
      function closeSheet(){ storeSheet.classList.remove('open'); storeSheet.style.display = 'none'; }

      addChat('مرحباً — Skull Realms جاهزة للاختبار');

      // PayPal Buttons (sandbox). For production replace client-id in script tag or render server-side order.
      if (window.paypal) {
        paypal.Buttons({
          createOrder: function(data, actions) {
            return actions.order.create({
              purchase_units: [{ amount: { value: '1.00' } }]
            });
          },
          onApprove: function(data, actions) {
            return actions.order.capture().then(function(details) {
              alert('تم الدفع: ' + (details.payer?.name?.given_name || 'مستخدم'));
            });
          }
        }).render('#paypal-button-container');
      }
    })();
  </script>
</body>
</html>
