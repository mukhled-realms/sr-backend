<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Skull Realms</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root { --bg: #0d0d11; --panel: #1a1a22; --gold: #e0b23d; --toxic: #b6ff3d; --ember: #ff4757; --violet: #9b6bff; }
        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Cairo', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        .stage { width: 100%; max-width: 450px; height: 100vh; display: flex; flex-direction: column; border: 1px solid #222; background: #0f0f14; position: relative; }
        
        /* HUD */
        .hud { display: flex; justify-content: space-between; padding: 15px; font-weight: 700; border-bottom: 1px solid #222; }
        .hud .title { font-size: 20px; letter-spacing: 1px; }
        
        /* Arena */
        .arena { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        #skullBtn { width: 200px; height: 200px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #2a2a34, #0d0d11); border: 2px solid #333; display: grid; place-items: center; font-size: 80px; cursor: pointer; transition: transform 0.05s; box-shadow: 0 0 0 1px #333; }
        #skullBtn:active { transform: scale(0.94); }
        .score { font-size: 48px; font-family: 'Teko', sans-serif; margin-bottom: 10px; text-shadow: 0 0 15px rgba(182, 255, 61, 0.2); }
        .level-label { font-size: 14px; color: #888; }
        
        /* Rail */
        .rail { display: flex; gap: 10px; padding: 15px; background: var(--panel); border-top: 1px solid #222; }
        .rail-btn { flex: 1; padding: 10px; text-align: center; background: #222; border-radius: 10px; cursor: pointer; font-size: 14px; transition: 0.2s; }
        .rail-btn:active { transform: scale(0.95); }
        
        /* Chat Feed */
        .chat-feed { position: absolute; left: 10px; bottom: 80px; width: 200px; max-height: 300px; overflow-y: auto; pointer-events: none; mask-image: linear-gradient(to top, black 70%, transparent 100%); }
        .chat-msg { background: rgba(0,0,0,0.7); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; border-left: 3px solid var(--toxic); animation: fadeUp 0.3s; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Fever Ring */
        .ring { position: absolute; width: 280px; height: 280px; border-radius: 50%; border: 2px solid #333; pointer-events: none; }
        .ring::before { content: ''; position: absolute; inset: -2px; border-radius: 50%; padding: 2px; background: conic-gradient(var(--toxic) calc(var(--pct,0) * 1%), transparent 0); -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude; transition: background 0.1s; }
    </style>
</head>
<body>
<div class="stage">
    <div class="hud">
        <div class="title">💀 SKULL REALMS</div>
        <div>💎 <span id="diamonds">120</span></div>
    </div>
    <div class="arena">
        <div class="ring" id="ring" style="--pct:0;"></div>
        <div class="score" id="score">0</div>
        <div class="level-label">المستوى <span id="level">1</span></div>
        <button id="skullBtn">💀</button>
        <div class="chat-feed" id="chatFeed"></div>
    </div>
    <div class="rail">
        <div class="rail-btn" id="chatBtn">💬</div>
        <div class="rail-btn" id="storeBtn">💎</div>
        <div class="rail-btn" id="supportBtn">🤍</div>
    </div>
</div>

<script>
    const socket = io();
    let score = 0, level = 1, diamonds = 120;
    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level');
    const ring = document.getElementById('ring');
    const diamondsEl = document.getElementById('diamonds');
    const chatFeed = document.getElementById('chatFeed');
    const skullBtn = document.getElementById('skullBtn');

    // 1. الضغط على الجمجمة
    skullBtn.addEventListener('click', () => {
        score += 1;
        scoreEl.textContent = score;
        let fever = Math.min(100, score % 100); // محاكاة الحماس
        ring.style.setProperty('--pct', fever);
        if(score % 50 === 0) {
            level += 1;
            levelEl.textContent = level;
            diamonds += 5;
            diamondsEl.textContent = diamonds;
        }
    });

    // 2. الشات الوهمي (للاختبار)
    setInterval(() => {
        const msgs = ['🔥 جوووو!', '💀 يلا نكمل', '⚡ مستوى جديد!'];
        const msg = msgs[Math.floor(Math.random() * msgs.length)];
        addChat('لاعب', msg);
    }, 5000);

    // دالة إضافة الشات
    function addChat(user, msg) {
        const el = document.createElement('div');
        el.className = 'chat-msg';
        el.innerHTML = `<b style="color: var(--toxic)">${user}</b>: ${msg}`;
        chatFeed.appendChild(el);
        if(chatFeed.children.length > 5) chatFeed.removeChild(chatFeed.firstChild);
    }

    // الأزرار (تجريبية)
    document.getElementById('chatBtn').onclick = () => alert('💬 الشات قيد التطوير!');
    document.getElementById('storeBtn').onclick = () => alert('💎 المتجر قريباً!');
    document.getElementById('supportBtn').onclick = () => alert('🤍 شكراً لدعمك!');
</script>
</body>
</html>
