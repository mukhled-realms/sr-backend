<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Skull Realms</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.3.2/pixi.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-900: #05040a;
            --neon-blue: #00d0ff;
            --neon-purple: #8a3cff;
            --lux-gold: #ffd166;
            --glass-veil: rgba(255,255,255,0.04);
        }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-900); }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        #game-container {
            background: radial-gradient(circle at 30% 30%, rgba(0,208,255,0.08), transparent 40%),
                        linear-gradient(180deg, rgba(10,10,12,0.6), rgba(0,0,0,0.6));
            box-shadow: 0 8px 40px rgba(0,208,255,0.05), inset 0 2px 12px rgba(255,209,102,0.02);
            backdrop-filter: blur(6px);
        }
        #chat-messages::-webkit-scrollbar, #settings-scroll::-webkit-scrollbar { width: 6px; }
        #chat-messages::-webkit-scrollbar-track, #settings-scroll::-webkit-scrollbar-track { background: transparent; }
        #chat-messages::-webkit-scrollbar-thumb, #settings-scroll::-webkit-scrollbar-thumb { background: var(--glass-veil); border-radius: 3px; }
    </style>
</head>
<body class="text-white p-3 max-w-md mx-auto min-h-screen flex flex-col justify-between select-none overflow-hidden">
    
    <!-- الشريط العلوي -->
    <header class="flex items-center justify-between text-xs mb-3 px-1">
        <button onclick="openSettings()" class="text-yellow-400 hover:text-yellow-300 transition flex items-center gap-1 font-orbitron">⚙️ الإعدادات</button>
        <span class="text-yellow-500 font-orbitron tracking-wider">Skull Realms</span>
        <span class="text-cyan-400 flex items-center gap-1.5">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-400"></span>
            </span>
            <span id="player-count">1</span> متصل
        </span>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="space-y-3 flex-1 flex flex-col">
        
        <!-- لوحة HUD العلوية -->
        <div class="grid grid-cols-3 gap-2">
            <div class="bg-slate-900/70 p-2 rounded-xl border border-slate-800 flex items-center gap-2">
                <span class="text-lg">🌟</span>
                <div>
                    <div class="text-[10px] text-slate-400">النقاط</div>
                    <div id="score-text" class="text-sm font-bold text-yellow-400 font-orbitron">0</div>
                </div>
            </div>
            <div class="bg-slate-900/70 p-2 rounded-xl border border-slate-800 flex items-center justify-center gap-2">
                <span class="text-lg">🛡️</span>
                <div class="text-center">
                    <div class="text-[10px] text-slate-400">المضاعف</div>
                    <div class="text-sm font-bold text-purple-400 font-orbitron">X1</div>
                </div>
            </div>
            <div class="bg-slate-900/70 p-2 rounded-xl border border-slate-800 flex items-center justify-end gap-2">
                <div class="text-right">
                    <div class="text-[10px] text-slate-400">الرتبة</div>
                    <div class="text-sm font-bold text-white">لاعب</div>
                </div>
                <span class="text-lg">⚔️</span>
            </div>
        </div>

        <!-- المنطقة المركزية (النواة النيونية) -->
        <div class="flex-1 flex items-center justify-center relative min-h-[220px]">
            <div id="flying-text" class="absolute font-orbitron font-bold text-lg text-yellow-300 opacity-0 transition-all duration-300 z-20 pointer-events-none">+15</div>
            <div id="game-container" class="w-[240px] h-[240px] rounded-full relative overflow-hidden border-2 border-slate-800 flex items-center justify-center"></div>
        </div>

        <!-- لوحة المتصدرين والشات -->
        <div class="grid grid-cols-5 gap-3 h-[130px]">
            <div class="col-span-2 bg-slate-900 rounded-2xl p-2.5 border border-slate-800 shadow-xl overflow-hidden">
                <h3 class="text-xs font-bold text-yellow-400 mb-1.5 font-orbitron">🏆 القمة</h3>
                <div id="leaderboard-box" class="text-xs space-y-1 text-slate-300">
                    <div class="flex justify-between items-center bg-slate-950/60 p-1.5 rounded-lg border border-slate-800/60">
                        <span class="font-medium text-white truncate">أنت</span>
                        <span id="lb-score" class="text-yellow-400 font-bold font-orbitron">0</span>
                    </div>
                </div>
            </div>

            <div class="col-span-3 bg-slate-900 rounded-2xl p-2.5 border border-slate-800 shadow-xl flex flex-col">
                <h3 class="text-xs font-bold text-slate-300 mb-1 font-orbitron">💬 الشات المباشر</h3>
                <div id="chat-messages" class="flex-1 overflow-y-auto text-xs space-y-1 bg-slate-950/80 p-2 rounded-xl border border-slate-800/60 mb-1.5">
                    <div class="text-teal-400"><span class="font-semibold text-indigo-400">النظام:</span> أهلاً بك في الساحة!</div>
                </div>
                <div class="flex gap-1">
                    <input type="text" id="chat-input" placeholder="اكتب رسالة..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-2 py-1 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <button onclick="sendMsg()" class="bg-indigo-700 hover:bg-indigo-600 px-3 py-1 rounded-xl text-xs font-bold text-white transition">إرسال</button>
                </div>
            </div>
        </div>

        <!-- زر دعم المطور الرئيسي -->
        <a href="https://paypal.me/MkledAnze900" target="_blank" class="block w-full text-center bg-gradient-to-r from-emerald-700 to-teal-700 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-2.5 px-4 rounded-2xl text-xs shadow-lg transition font-orbitron tracking-wider flex items-center justify-center gap-2">
            💳 دعم المطور (تبرع)
        </a>
    </main>

    <!-- نافذة الإعدادات المنبثقة (Command Center) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="w-full max-w-sm bg-black/90 border border-yellow-500/20 rounded-2xl p-6 relative shadow-2xl">
            
            <!-- زر الإغلاق -->
            <button onclick="closeSettings()" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl font-light">✕</button>

            <!-- المحتوى -->
            <div id="settings-scroll" class="flex flex-col gap-5 max-h-[80vh] overflow-y-auto pr-1">
                
                <!-- 1. لوحة الصدارة -->
                <div>
                    <h3 class="text-yellow-500/80 text-xs font-bold tracking-widest mb-2 uppercase border-b border-white/5 pb-1 font-orbitron">🏆 أفضل اللاعبين</h3>
                    <div class="space-y-1 text-xs">
                        <div class="flex justify-between text-gray-300 bg-white/5 p-2 rounded-lg"><span>1. أنت</span><span id="modal-score" class="text-yellow-500 font-orbitron">0</span></div>
                    </div>
                </div>

                <!-- 2. قاعة الشرف -->
                <div>
                    <h3 class="text-yellow-500/80 text-xs font-bold tracking-widest mb-2 uppercase border-b border-white/5 pb-1 font-orbitron">✨ قاعة الشرف</h3>
                    <div id="supporters-list" class="flex flex-wrap gap-2 text-[10px]">
                        <span class="text-gray-400 italic">قريباً مع أول داعم...</span>
                    </div>
                </div>

                <!-- 3. الإعدادات السريعة -->
                <div class="flex flex-col gap-2 mt-2 pt-3 border-t border-white/5">
                    <button onclick="toggleSound()" class="flex justify-between items-center w-full py-2 px-3 bg-white/5 rounded-xl hover:bg-white/10 transition">
                        <span class="text-xs">🔊 الصوت</span>
                        <span id="sound-status" class="text-xs text-green-400">مفعل</span>
                    </button>
                    <button onclick="resetGame()" class="flex justify-between items-center w-full py-2 px-3 bg-white/5 rounded-xl hover:bg-white/10 transition">
                        <span class="text-xs">🔄 إعادة ضبط النقاط</span>
                        <span class="text-red-400/50 text-[10px]">تصفير</span>
                    </button>
                    <a href="https://paypal.me/MkledAnze900" target="_blank" class="block text-center mt-2 bg-gradient-to-r from-amber-600 to-yellow-600 hover:opacity-90 py-2.5 rounded-xl font-bold text-xs text-black uppercase shadow-lg shadow-amber-900/20 transition font-orbitron">
                        💳 دعم المطور (تبرع)
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
        const sound = new Howl({ 
            src: ['https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3'], 
            volume: 0.4 
        });
        
        let score = 0;
        let soundEnabled = true;

        // دوال نافذة الإعدادات
        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }
        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }
        function toggleSound() {
            soundEnabled = !soundEnabled;
            sound.mute(!soundEnabled);
            const statusEl = document.getElementById('sound-status');
            statusEl.innerText = soundEnabled ? 'مفعل' : 'معطل';
            statusEl.className = soundEnabled ? 'text-xs text-green-400' : 'text-xs text-red-400';
        }
        function resetGame() {
            if(confirm('هل أنت متأكد من تصفير النقاط؟')) {
                score = 0;
                document.getElementById('score-text').innerText = score;
                document.getElementById('lb-score').innerText = score;
                document.getElementById('modal-score').innerText = score;
                closeSettings();
            }
        }

        const containerElem = document.getElementById('game-container');
        const app = new PIXI.Application({
            backgroundAlpha: 0,
            width: containerElem.clientWidth,
            height: containerElem.clientHeight,
            antialias: true,
            resolution: window.devicePixelRatio || 1,
        });
        containerElem.appendChild(app.view);

        const coreContainer = new PIXI.Container();
        coreContainer.x = app.screen.width / 2;
        coreContainer.y = app.screen.height / 2;
        coreContainer.interactive = true;
        coreContainer.cursor = 'pointer';
        app.stage.addChild(coreContainer);

        // الطبقة الخارجية
        const outerGlow = new PIXI.Graphics();
        outerGlow.beginFill(0x8a3cff, 0.15);
        outerGlow.drawCircle(0, 0, 75);
        outerGlow.endFill();
        coreContainer.addChild(outerGlow);

        // الطبقة الوسطى (العجلة الذهبية الدوارة)
        const goldMesh = new PIXI.Graphics();
        goldMesh.lineStyle(2, 0xffd166, 0.8);
        goldMesh.drawCircle(0, 0, 55);
        goldMesh.moveTo(-35, -35); goldMesh.lineTo(35, 35);
        goldMesh.moveTo(-35, 35); goldMesh.lineTo(35, -35);
        coreContainer.addChild(goldMesh);

        // الطبقة الداخلية
        const innerCore = new PIXI.Graphics();
        innerCore.beginFill(0x00d0ff, 0.9);
        innerCore.drawCircle(0, 0, 40);
        innerCore.endFill();
        coreContainer.addChild(innerCore);

        // تفاعل النقر
        coreContainer.on('pointerdown', () => {
            score += 15;
            if(soundEnabled) sound.play();
            document.getElementById('score-text').innerText = score;
            document.getElementById('lb-score').innerText = score;
            document.getElementById('modal-score').innerText = score;
            
            coreContainer.scale.set(1.12);
            setTimeout(() => coreContainer.scale.set(1), 100);

            const flyingText = document.getElementById('flying-text');
            flyingText.style.opacity = '1';
            flyingText.style.transform = 'translateY(-15px)';
            setTimeout(() => {
                flyingText.style.opacity = '0';
                flyingText.style.transform = 'translateY(0)';
            }, 250);
        });

        app.ticker.add((delta) => {
            goldMesh.rotation += 0.02 * delta;
        });

        const socket = io();
        socket.on('chat_message', (data) => {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML += `<div class="text-slate-200"><span class="font-semibold text-indigo-400">${data.username}:</span> ${data.text}</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        });

        function sendMsg() {
            const input = document.getElementById('chat-input');
            if (!input.value.trim()) return;
            socket.emit('chat_message', { username: 'زائر', text: input.value });
            input.value = '';
        }
    </script>
</body>
</html>
